[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Scheduled Function：每天 UTC 14:00 = 台灣 22:00
[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[functions]
  node_bundler = "esbuild"

[[functions.schedule]]
  function = "erp-reminder"
  cron = "0 14 * * *"
